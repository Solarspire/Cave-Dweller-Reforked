plugins { id 'net.neoforged.moddev' }
neoForge {
    version = neoforge_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        smokeServer { server(); gameDirectory = file('run/smoke'); programArgument '--nogui' }
    }
    mods { cave_dweller { sourceSet sourceSets.main } }
}
dependencies {
    jarJar(implementation("com.geckolib:geckolib-neoforge-${minecraft_version}")) {
        version {
            strictly "[${geckolib_version},6)"
            prefer geckolib_version
        }
    }
}

tasks.named('runSmokeServer', JavaExec) { standardInput = System.in }

neoForge { runs { smokeClient { client(); gameDirectory = file('run/client-smoke'); programArguments.addAll(project.hasProperty('smokeServerAddress') ? '--quickPlayMultiplayer' : '--quickPlaySingleplayer', project.findProperty('smokeServerAddress') ?: "smoke-world-${minecraft_version}") } } }
