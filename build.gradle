plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version '1.17.21' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}
subprojects {
    apply plugin: 'java'
    group = 'de.cadentem.cave_dweller'
    version = "${mod_version}+${minecraft_version}"
    base { archivesName = "cave_dweller-${project.name}" }
    java { toolchain.languageVersion = JavaLanguageVersion.of(java_version as int); withSourcesJar() }
    sourceSets {
        main.java.srcDir rootProject.file('common/src/main/java')
        main.resources.srcDir rootProject.file('common/src/main/resources')
        test.java.srcDir rootProject.file('common/src/test/java')
    }
    repositories {
        mavenCentral()
        maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'; content { includeGroup 'com.geckolib' } }
    }
    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
        testImplementation 'com.google.code.gson:gson:2.11.0'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = java_version as int }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    processResources {
        def props = [version: project.version, minecraft_version: minecraft_version, java_version: java_version,
                     fabric_loader_version: fabric_loader_version, geckolib_version: geckolib_version]
        inputs.properties props
        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) { expand props }
    }
}
tasks.named('build') { dependsOn ':fabric:build', ':neoforge:build' }
tasks.named('check') { dependsOn ':fabric:check', ':neoforge:check' }
